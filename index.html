<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學生作業缺交通知看板</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--mute:#64748b;--line:#d9dee8;--navy:#111827;
--ok-bg:#dcfce7;--ok-bd:#86efac;--ok:#166534;--no-bg:#fee2e2;--no-bd:#fca5a5;--no:#991b1b;--late-bg:#fef3c7;--late-bd:#fcd34d;--late:#92400e}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mute:#94a3b8;--line:#334155;--navy:#f1f5f9;
--ok-bg:#14532d;--ok-bd:#166534;--ok:#bbf7d0;--no-bg:#7f1d1d;--no-bd:#991b1b;--no:#fecaca;--late-bg:#78350f;--late-bd:#92400e;--late:#fde68a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px 16px 48px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:22px;text-align:center;margin:8px 0 16px}
h2{font-size:18px;margin:0 0 12px}
p.hint{color:var(--mute);font-size:14px;margin:0 0 10px;line-height:1.5}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:110px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;background:var(--navy);color:var(--card);width:100%;margin-top:10px}
button.sec{background:var(--bg);color:var(--ink);width:auto;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.tile{border:2px solid;border-radius:14px;padding:14px 4px;text-align:center;font-weight:800;font-size:18px;cursor:pointer;margin:0;width:auto;line-height:1.3}
.tile small{display:block;font-size:13px;font-weight:700}
.tile.done{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.tile.missing{background:var(--no-bg);border-color:var(--no-bd);color:var(--no)}
.tile.late{background:var(--late-bg);border-color:var(--late-bd);color:var(--late)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:1.5px solid var(--line);border-radius:16px;text-align:center;padding:16px 4px;color:var(--mute)}
.stat b{display:block;font-size:44px;line-height:1.2}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{margin:0;padding:12px 4px;font-size:14px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.tabs button.on{background:var(--navy);color:var(--card)}
.item{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;font-weight:700}
.badge{font-size:14px;padding:6px 14px;border-radius:10px}
.badge.done{background:var(--ok-bg);color:var(--ok)}.badge.missing{background:var(--no-bg);color:var(--no)}.badge.late{background:var(--late-bg);color:var(--late)}
.who{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:14px 16px;font-weight:800}
.who a{color:#2563eb;font-weight:600;cursor:pointer;font-size:15px}
.err{color:var(--no);font-weight:700;margin-top:10px;min-height:1.2em}
.sum{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sum .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.sum .top button{margin:0;padding:8px 12px;font-size:14px;width:auto;flex:none}.rost{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.rost button{margin:0;width:100%;text-align:left;padding:10px 12px;font-size:15px;font-weight:600;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}.rost button b{margin-right:8px}.sum .top span{min-width:0}
.sum div.l{color:var(--mute);font-size:14px;margin-top:6px;line-height:1.5}
.muted{color:var(--mute);font-size:14px}
.hide{display:none}
.switch{display:flex;gap:8px;justify-content:center;max-width:560px;margin:0 auto 14px}.switch a{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none}.switch a.on{background:var(--navy);color:var(--card);border-color:var(--navy)}.switch a:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
</style>
</head>
<body>
<nav class="switch"><a id="goStudent" href="#student">學生頁面</a><a id="goTeacher" href="#teacher">教師頁面</a></nav>
<div class="wrap" id="app"></div>
<script>
/* ===== 只需要改這一行：貼上 GAS 網頁應用程式網址 ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbwYz3jq-WLVe8gJitzG1CCkr4GHFZzMBE47k3kzY6BnTWPinlo1MhSPx-X4oE3K8h6v/exec";
/* ================================================== */

const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
$(location.hash === '#teacher' ? '#goTeacher' : '#goStudent').classList.add('on');
const ST = {done:'完成', missing:'未完成', late:'遲交'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = (d=0) => { const t = new Date(Date.now()-d*864e5); return (t.getMonth()+1)+'/'+t.getDate(); };

async function api(body){
  const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}

/* ============ 學生／家長端 ============ */
async function studentView(){
  app.innerHTML = `<div class="card"><h1>學生作業缺交通知看板</h1><p class="muted" style="text-align:center">載入中…</p></div>`;
  let classes = [];
  try{ const c = await api({action:'classes'}); classes = c.classes || []; }catch(e){}
  if(!classes.length){
    app.innerHTML = `<div class="card"><h1>學生作業缺交通知看板</h1><p class="muted" style="text-align:center">目前沒有開放查詢的班級，或連線失敗，請稍後再試。</p></div>`;
    return;
  }
  const saved = JSON.parse(sessionStorage.getItem('hw_who') || 'null');
  app.innerHTML = `<div class="card"><h1>學生作業缺交通知看板</h1>
    <p class="hint" style="text-align:center">請選擇<b>班級</b>並輸入<b>座號</b></p>
    <select id="cls" style="margin-bottom:10px;font-weight:700">${classes.map(c=>`<option value="${esc(c)}">${esc(c)} 班</option>`).join('')}</select>
    <input id="seat" inputmode="numeric" maxlength="2" placeholder="請輸入座號" style="text-align:center;font-size:22px;font-weight:800">
    <button id="go">查詢作業狀況</button><div class="err" id="err"></div></div>`;
  const go = async (cls, seat) => {
    $('#err').textContent = '查詢中…';
    try{
      const r = await api({action:'query', cls, seat});
      if(!r.ok){ $('#err').textContent = r.error || '查詢失敗'; return; }
      sessionStorage.setItem('hw_who', JSON.stringify({cls, seat})); showResult(r);
    }catch(e){ $('#err').textContent = '連線失敗，請稍後再試'; }
  };
  $('#go').onclick = () => {
    const s = $('#seat').value.trim();
    if(!/^\d{1,2}$/.test(s)){ $('#err').textContent='請輸入座號（數字）'; return; }
    go($('#cls').value, s);
  };
  $('#seat').onkeydown = e => { if(e.key==='Enter') $('#go').click(); };
  if(saved && classes.includes(saved.cls)){ $('#cls').value = saved.cls; $('#seat').value = saved.seat; go(saved.cls, saved.seat); }
}
function showResult(r){
  let tab = r.items.some(i=>i.status==='missing') ? 'missing' : 'all';
  const pending = r.items.filter(i=>i.status==='missing').length;
  const draw = () => {
    const list = r.items.filter(i => tab==='missing' ? i.status==='missing' : tab==='submitted' ? i.status!=='missing' : true);
    app.innerHTML = `<div class="card"><h1>學生作業缺交通知看板</h1>
      <div class="who"><span>${esc(r.cls)} 班　${r.seat} 號</span><a id="sw">換其他座號</a></div>
      <div class="stats" style="margin-top:16px">
        <div class="stat">尚未完成<b style="color:var(--no)">${pending}</b></div>
        <div class="stat">已繳交(含遲交)<b style="color:var(--ok)">${r.items.length-pending}</b></div></div>
      <div class="tabs">${[['missing','尚未完成'],['submitted','已繳交(含遲交)'],['all','全部作業']].map(([k,t])=>`<button data-t="${k}" class="${tab===k?'on':''}">${t}</button>`).join('')}</div>
      ${list.length ? list.map(i=>`<div class="item"><span>${esc(i.title)}</span><span class="badge ${i.status}">${ST[i.status]}${i.status==='late'&&i.date?' '+esc(i.date):''}</span></div>`).join('') : '<p class="muted" style="text-align:center">這個分類目前沒有作業 🎉</p>'}
    </div>`;
    $('#sw').onclick = () => { sessionStorage.removeItem('hw_who'); studentView(); };
    app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  };
  draw();
}

/* ============ 老師端 ============ */
let T = {pw:'', data:null, aid:null, cls:''};
function teacherLogin(msg=''){
  app.innerHTML = `<div class="card"><h1>老師登記頁</h1><input id="pw" type="password" placeholder="老師密碼"><label style="display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;font-size:15px"><input id="rem" type="checkbox" checked style="width:auto;margin:0"> 這是我自己的裝置，保持登入</label>
    <button id="ok">登入</button><div class="err">${esc(msg)}</div></div>`;
  $('#ok').onclick = async () => {
    T.pw = $('#pw').value;
    const r = await api({action:'load', pw:T.pw, cls:T.cls});
    if(!r.ok) return teacherLogin(r.error||'密碼錯誤');
    rememberPw(T.pw); T.data = r; T.cls = r.cls; T.aid = (r.assignments[0]||{}).id; teacherView();
  };
  $('#pw').onkeydown = e => { if(e.key==='Enter') $('#ok').click(); };
}
const recOf = (aid,seat) => T.data.records.find(x=>x.aid===aid && x.seat===seat);
function teacherView(){
  const d = T.data, a = d.assignments.find(x=>x.id===T.aid);
  const makeup = T.makeup || today();
  const hasCls = d.classes.length > 0;
  const rosterCard = `<div class="card"><h2>班級與座號設定</h2>
    <p class="hint">輸入班級名稱與座號範圍（例：801、<b>1-32</b>；有缺號可寫 1-10,12-32）。已存在的班級重新儲存＝覆蓋座號。</p>
    <input id="rc" placeholder="班級名稱，例：801" value="${esc(T.cls||'')}" style="margin-bottom:10px">
    <input id="ro" placeholder="座號，例：1-32">
    <button id="saveRo">儲存班級</button>
    ${hasCls?`<button class="sec" id="delCls" style="margin-top:8px;width:100%;color:var(--no)">刪除目前班級（${esc(T.cls)}）與其所有作業</button>`:''}</div>`;
  const namesCard = `<div class="card"><h2>${esc(T.cls)} 班名單與姓名</h2>
      <p class="hint">點一個座號可單獨修改姓名。姓名只有老師登入後看得到，學生與家長那一頁不會顯示。</p>
      <div class="rost" id="rost">${d.seats.map(s=>{const n=nameOf(s);return `<button data-s="${s}"><b>${s}號</b>${n?esc(n):'<span class="muted">未輸入姓名</span>'}</button>`;}).join('') || '<p class="muted">這個班還沒有名單</p>'}</div>
      <p class="hint" style="margin-top:14px"><b>匯入姓名</b>：每行「座號 空格 姓名」，可以直接從 Excel 兩欄貼上。名單裡沒有的座號會自動新增。</p>
      <textarea id="nm" placeholder="1 王小明&#10;2 李小華"></textarea>
      <button id="saveNames">匯入姓名</button></div>`;
  app.innerHTML = (hasCls ? `
  <div class="card"><h2>選擇班級</h2><select id="clsSel" style="font-weight:800">${d.classes.map(c=>`<option value="${esc(c)}" ${c===T.cls?'selected':''}>${esc(c)} 班（${c===T.cls?d.seats.length+' 人':''}）</option>`.replace('（）','')).join('')}</select></div>
  <div class="card"><h2>新增作業項目</h2><input id="nt" placeholder="例：${today()}數卷12回"><button id="add">新增作業（${esc(T.cls)} 班）</button></div>
  <div class="card"><h2>補交登記設定</h2><p class="hint">指定切換「遲交」時記錄的補交日期：</p>
    <div class="row"><input id="mk" value="${esc(makeup)}"><button class="sec" id="td">今天</button><button class="sec" id="yd">昨天</button></div></div>
  <div class="card"><h2>批改登記（點擊方塊快速切換）</h2>
    ${d.assignments.length ? `<select id="sel">${d.assignments.map(x=>`<option value="${x.id}" ${x.id===T.aid?'selected':''}>${esc(x.title)}${x.published?'':'（未發布）'}</option>`).join('')}</select>
    <p class="hint" style="margin-top:10px">順序：完成 → 未完成 → 遲交 → 完成（已是遲交時點擊可改日期，留空＝改回完成）</p>
    <div class="grid" id="grid"></div>
    <button id="pub">${a&&a.published?'已發布給學生看・點此取消發布':'批改完成，發布給學生／家長看'}</button>
    <button class="sec" id="del" style="margin-top:8px;width:100%;color:var(--no)">刪除這份作業</button>` : '<p class="muted">這個班尚無作業，請先新增。</p>'}
  </div>
  <div class="card"><h2>缺交總覽與家長提醒</h2><p class="hint">統計 ${esc(T.cls)} 班所有「已發布」作業中尚未完成的項目。</p><div id="sum"></div></div>` : `
  <div class="card"><h1>老師登記頁</h1><p class="muted" style="text-align:center">還沒有任何班級，請先在下方新增。</p></div>`)
  + (hasCls ? namesCard : '') + rosterCard + `<button class="sec" id="out" style="width:100%">登出</button>`;

  const reload = async () => { const r = await api({action:'load',pw:T.pw,cls:T.cls}); if(r.ok){ T.data=r; T.cls=r.cls; teacherView(); } else teacherLogin(r.error); };
  $('#out').onclick = () => { forgetPw(); T={pw:'',data:null,aid:null,cls:''}; teacherLogin(); };
  $('#saveRo').onclick = async () => {
    const cls = $('#rc').value.trim();
    const r = await api({action:'roster',pw:T.pw,cls,text:$('#ro').value});
    alert(r.ok ? cls+' 班已儲存 '+r.count+' 位' : r.error);
    if(r.ok){ T.cls = cls; T.aid = null; reload(); }
  };
  const bindNames = () => {
      $('#saveNames').onclick = async () => {
        const r = await api({action:'names',pw:T.pw,cls:T.cls,text:$('#nm').value});
        if(!r.ok){ alert(apiErr(r)); return; }
        alert('已更新 '+r.count+' 位姓名'+(r.added?'，新增 '+r.added+' 個座號':''));
        reload();
      };
      document.querySelectorAll('#rost button').forEach(b => b.onclick = async () => {
        const seat = Number(b.dataset.s), v = prompt(seat+' 號的姓名（留空＝清除）', nameOf(seat));
        if(v === null) return;
        const r = await api({action:'setname',pw:T.pw,cls:T.cls,seat,name:v.trim()});
        if(r.ok) reload(); else alert(apiErr(r));
      });
    };
  if(hasCls) bindNames();
  if(hasCls){
    $('#clsSel').onchange = async e => { T.cls = e.target.value; T.aid = null; const r = await api({action:'load',pw:T.pw,cls:T.cls}); if(r.ok){ T.data=r; T.aid=(r.assignments[0]||{}).id; teacherView(); } };
    $('#delCls').onclick = async () => { if(confirm('確定刪除 '+T.cls+' 班？這個班的作業與登記紀錄都會一併刪除。')){ await api({action:'delClass',pw:T.pw,cls:T.cls}); T.cls=''; T.aid=null; reload(); } };
    $('#add').onclick = async () => { const t=$('#nt').value.trim(); if(!t) return; const r=await api({action:'add',pw:T.pw,cls:T.cls,title:t}); if(r.ok){ T.aid=r.id; reload(); } };
    $('#mk').oninput = e => T.makeup = e.target.value;
    $('#td').onclick = () => { T.makeup = today(); $('#mk').value = T.makeup; };
    $('#yd').onclick = () => { T.makeup = today(1); $('#mk').value = T.makeup; };
    if(a){
      $('#sel').onchange = e => { T.aid = e.target.value; teacherView(); };
      $('#pub').onclick = async () => { await api({action:'publish',pw:T.pw,aid:a.id,value:a.published?0:1}); reload(); };
      $('#del').onclick = async () => { if(confirm('確定刪除「'+a.title+'」？')){ await api({action:'del',pw:T.pw,aid:a.id}); T.aid=null; reload(); } };
      drawGrid(a);
    }
    drawSummary();
  }
}
const nameOf = seat => { const x = ((T.data && T.data.roster) || []).find(r=>r.seat===seat); return x ? (x.name||'') : ''; };
const apiErr = r => (r && r.error === 'unknown action') ? '後端還沒更新到支援姓名的版本，請先更新後端程式' : (r && r.error) || '失敗';
function drawGrid(a){
  const g = $('#grid'); g.innerHTML = '';
  T.data.seats.forEach(seat => {
    const rec = recOf(a.id, seat), st = rec ? rec.status : 'done';
    const b = document.createElement('button'); b.className = 'tile '+st;
    b.innerHTML = `${seat} 號${nameOf(seat)?`<small>${esc(nameOf(seat))}</small>`:''}<small>${ST[st]}${st==='late'&&rec.date?' '+esc(rec.date):''}</small>`;
    b.onclick = async () => {
      let ns, date = '';
      if(st==='done') ns='missing';
      else if(st==='missing'){ ns='late'; date = $('#mk').value || today(); }
      else { const v = prompt('補交日期（留空＝改回完成）', rec.date||''); if(v===null) return; if(v.trim()===''){ ns='done'; } else { ns='late'; date=v.trim(); } }
      T.data.records = T.data.records.filter(x=>!(x.aid===a.id&&x.seat===seat));
      if(ns!=='done') T.data.records.push({aid:a.id,seat,status:ns,date});
      drawGrid(a); drawSummary();
      const r = await api({action:'set',pw:T.pw,aid:a.id,seat,status:ns,date});
      if(!r.ok) alert('儲存失敗：'+(r.error||''));
    };
    g.appendChild(b);
  });
}
function drawSummary(){
  const d = T.data, pub = d.assignments.filter(x=>x.published), box = $('#sum');
  const rows = d.seats.map(seat => ({seat, name:nameOf(seat), miss: pub.filter(x=>{const r=recOf(x.id,seat);return r&&r.status==='missing';}).map(x=>x.title)}))
    .filter(x=>x.miss.length).sort((p,q)=>p.seat-q.seat);
  if(!rows.length){ box.innerHTML = '<p class="muted">目前沒有缺交 🎉</p>'; return; }
  const link = location.origin + location.pathname;
  const copy = (btn, txt, label) => navigator.clipboard.writeText(txt).then(()=>{ btn.textContent='已複製'; setTimeout(()=>btn.textContent=label,1500); });
  box.innerHTML = `<button id="copyAll" style="margin:0 0 12px">複製全部缺交名單（${rows.length} 位）</button>`
    + rows.map(x=>`<div class="sum"><div class="top"><span>${x.seat} 號${x.name?' '+esc(x.name):''}・缺 ${x.miss.length} 份</span><button data-s="${x.seat}">複製提醒</button></div><div class="l">${x.miss.map(esc).join('、')}</div></div>`).join('');
  $('#copyAll').onclick = e => {
    const txt = `【作業提醒】${T.cls}班 目前缺交名單：\n\n${rows.map(x=>x.seat+'號'+(x.name?' '+x.name:'')+'：'+x.miss.join('、')).join('\n')}\n\n請同學盡快補交，家長也可協助提醒，謝謝！\n隨時可查詢：${link}\n（選擇 ${T.cls} 班並輸入座號）`;
    copy(e.target, txt, `複製全部缺交名單（${rows.length} 位）`);
  };
  box.querySelectorAll('button[data-s]').forEach(b => b.onclick = () => {
    const x = rows.find(r=>r.seat==b.dataset.s);
    const txt = `【作業提醒】${T.cls}班 ${x.seat}號${x.name?' '+x.name:''} 家長您好：\n${x.name?x.name+'同學':'孩子'}目前尚缺以下作業：\n${x.miss.map(m=>'・'+m).join('\n')}\n麻煩協助提醒孩子盡快補交，謝謝您！\n隨時可查詢：${link}\n（選擇 ${T.cls} 班並輸入座號 ${x.seat} 號）`;
    copy(b, txt, '複製提醒');
  });
}


/* ============ 跨裝置同步：保持登入＋自動更新 ============ */
// 勾「保持登入」的裝置把登入記在這台（localStorage），Mac、iPhone、iPad 各登入一次之後就不用再輸入密碼。
// 資料本來就存在雲端；老師頁每 20 秒、以及切回這個分頁時重新拉取，別台裝置的登記會自動出現（正在輸入時不打斷）。
const KEEP = 'hw_pw_keep';
function savedPw(){ try{ return sessionStorage.getItem('hw_pw') || localStorage.getItem(KEEP) || ''; }catch(e){ return ''; } }
function rememberPw(pw){ try{ sessionStorage.setItem('hw_pw', pw); const r=document.getElementById('rem'); if(!r || r.checked) localStorage.setItem(KEEP, pw); else localStorage.removeItem(KEEP); }catch(e){} }
function forgetPw(){ try{ sessionStorage.removeItem('hw_pw'); localStorage.removeItem(KEEP); }catch(e){} }
let syncBusy = false;
async function autoSync(){
  if(syncBusy || document.hidden || location.hash !== '#teacher' || !T.pw || !T.data) return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'rem') return; // 正在輸入，晚點再更新
  syncBusy = true;
  try{
    const r = await api({action:'load', pw:T.pw, cls:T.cls});
    if(r.ok && JSON.stringify(r) !== JSON.stringify(T.data) && T.data){
      const keepAid = T.aid; T.data = r; T.cls = r.cls;
      T.aid = r.assignments.some(x=>x.id===keepAid) ? keepAid : (r.assignments[0]||{}).id;
      const y = window.scrollY; teacherView(); window.scrollTo(0, y);
    }
  }catch(e){} finally{ syncBusy = false; }
}
setInterval(autoSync, 20000);
document.addEventListener('visibilitychange', autoSync);

/* ============ 啟動 ============ */
if(location.hash === '#teacher'){
  const pw = savedPw();
  if(pw){ T.pw = pw; api({action:'load',pw}).then(r => { if(r.ok){ T.data=r; T.cls=r.cls; T.aid=(r.assignments[0]||{}).id; teacherView(); } else teacherLogin(); }); }
  else teacherLogin();
} else studentView();
window.onhashchange = () => location.reload();
</script>
